name: Tag release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: denaro-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' is not a supported semantic version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not contained in main."
            exit 1
          fi
          now="$(date -u +%s)"
          epoch="$(date -u -d '2026-01-01T00:00:00Z' +%s)"
          version_code="$((100000 + now - epoch))"
          if (( version_code > 2100000000 )); then
            echo "::error::Derived version code exceeds Google Play's limit."
            exit 1
          fi
          version_name="${tag#v}"
          prerelease=false
          [[ "$version_name" == *-* ]] && prerelease=true
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DENARO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/denaro-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "DENARO_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run release checks and build signed artifacts
        env:
          DENARO_UPLOAD_STORE_PASSWORD: ${{ secrets.DENARO_UPLOAD_STORE_PASSWORD }}
          DENARO_UPLOAD_KEY_ALIAS: ${{ secrets.DENARO_UPLOAD_KEY_ALIAS }}
          DENARO_UPLOAD_KEY_PASSWORD: ${{ secrets.DENARO_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PreleaseVersionCode=${{ steps.version.outputs.code }} \
            -PreleaseVersionName=${{ steps.version.outputs.name }} \
            testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "$mapping" ]]; then
            echo "::error::R8 did not produce a non-empty mapping.txt."
            exit 1
          fi
          if ! unzip -Z1 app/build/outputs/bundle/release/app-release.aab |
            grep -Fx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' \
              >/dev/null; then
            echo "::error::The release AAB does not contain its R8 mapping."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-assets/denaro-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/release-assets/denaro-${{ steps.version.outputs.name }}.aab"

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: denaro-${{ steps.version.outputs.name }}-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "Denaro ${{ steps.version.outputs.name }}"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$RUNNER_TEMP/release-assets/denaro-${{ steps.version.outputs.name }}.apk" \
            "$RUNNER_TEMP/release-assets/denaro-${{ steps.version.outputs.name }}.aab"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Publish AAB to completed internal testing
        env:
          DENARO_UPLOAD_STORE_PASSWORD: ${{ secrets.DENARO_UPLOAD_STORE_PASSWORD }}
          DENARO_UPLOAD_KEY_ALIAS: ${{ secrets.DENARO_UPLOAD_KEY_ALIAS }}
          DENARO_UPLOAD_KEY_PASSWORD: ${{ secrets.DENARO_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PreleaseVersionCode=${{ steps.version.outputs.code }} \
            -PreleaseVersionName=${{ steps.version.outputs.name }} \
            publishReleaseBundle

      - name: Finalize stable GitHub Release
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Finalize GitHub prerelease
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
